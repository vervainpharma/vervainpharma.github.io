<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Under Construction</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(#2a2a29, #1c1c1c);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            color: white;
        }
        
        .container {
            padding: 20px;
            max-width: 600px;
        }
        
        h1 {
            font-size: 3em;
            margin: 0 0 20px 0;
        }
        
        p {
            font-size: 1.2em;
            opacity: 0.9;
            margin: 10px 0;
        }
        
        .emoji {
            font-size: 4em;
            margin-bottom: 20px;
        }

        .contact-section {
            margin-top: 40px;
            padding-top: 30px;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            text-align: left;
        }

        .contact-item {
            display: flex;
            align-items: center;
            margin: 15px 0;
            font-size: 1.1em;
        }

        .contact-icon {
            margin-right: 15px;
            width: 30px;
            text-align: center;
            color: #4a9eff;
            flex-shrink: 0;
            font-size: 1.3em;
        }

        .bluesky-butterfly {
            display: inline-block;
            width: 1.3em;
            height: 1.3em;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%234a9eff"><path d="M12 1c-6.3 0-7.5 5.5-7.5 9.5 0 3 .5 6 3 8-1 4 5 5 4.5 5s2 1 4 1 3-1 4.5-5c2.5-2 3-5 3-8 0-4-1.2-9.5-7.5-9.5z"/></svg>');
            background-repeat: no-repeat;
            background-size: contain;
            background-position: center;
        }

        .contact-item a {
            color: #4a9eff;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .contact-item a:hover {
            color: #7bb3ff;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Coming soon.</h1>
        
        <div class="contact-section">
            <h2 style="font-size: 1.3em; margin-bottom: 20px; text-align: left;">Get in touch</h2>
            
            <div class="contact-item">
                <div class="contact-icon">
                    <i class="fas fa-envelope"></i>
                </div>
                <a href="mailto:orders@vervainpharma.cc">orders@vervainpharma.cc</a>
            </div>
            
            <div class="contact-item">
                <div class="contact-icon">
                    <i class="fab fa-reddit"></i>
                </div>
                <a href="https://reddit.com/u/VervainPharma_CC" target="_blank">u/VervainPharma_CC</a>
            </div>
            
            <div class="contact-item">
                <div class="contact-icon">
                    <div class="bluesky-butterfly"></div>
                </div>
                <a href="https://bsky.app/profile/vervainpharma.cc" target="_blank">vervainpharma.cc</a>
            </div>
        </div>
    </div>
</body>
</html>
